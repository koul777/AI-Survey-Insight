[project]
name = "ai-survey-insight"
version = "0.1.0"
description = "AI-assisted Korean survey free-response analysis and report generation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "kiwipiepy>=0.20,<1",
  "openpyxl>=3.1,<4",
  "pandas>=2.1,<3",
  "pydantic>=2.8,<3",
  "python-pptx>=1.0,<2",
  "scikit-learn>=1.4,<2",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "httpx2>=2,<3",
]

[project.scripts]
survey-insight = "survey_insight.cli:main"

[tool.setuptools.packages.find]
include = ["survey_insight*"]
